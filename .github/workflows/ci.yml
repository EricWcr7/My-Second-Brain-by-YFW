name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: pytest -q
      - run: python scripts/check_public_snapshot.py

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: llmwiki/web/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[web]'
      - working-directory: llmwiki/web/frontend
        run: npm ci
      - working-directory: llmwiki/web/frontend
        run: npm run typecheck
      - working-directory: llmwiki/web/frontend
        run: npm run build
      - run: git diff --exit-code -- llmwiki/web/static
      - working-directory: llmwiki/web/frontend
        run: npx playwright install --with-deps chromium
      - run: llmwiki init .
      - working-directory: llmwiki/web/frontend
        run: npm run test:e2e
